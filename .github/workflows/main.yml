---
name: CI
run-name: "${{ github.event_name == 'pull_request' && format('CI: {0}', github.event.pull_request.title) || '' }}"

on:
  push:
    branches:
      - master
      - 'ver/**'
  pull_request:
    branches:
      - master
      - 'ver/**'

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      matrix:
        node:
          - '22'
          - '24'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup
        uses: ./.github/actions/setup
        with:
          node_version: ${{ matrix.node }}
      - name: Test
        run: npm test
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup
        uses: ./.github/actions/setup
      - name: Lint
        run: npm run lint
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup
        uses: ./.github/actions/setup
      - name: Move runtime dependencies
        run: |
          version=$(jq -r '.devDependencies."@pureskillgg/awsjs"' < package.json)
          npm uninstall @pureskillgg/awsjs
          npm install "@pureskillgg/awsjs@${version}"
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_DEFAULT_REGION }}
      - name: Build
        run: npm run sls:package
        env:
          SERVERLESS_ACCESS_KEY: ${{ secrets.SERVERLESS_ACCESS_KEY }}
