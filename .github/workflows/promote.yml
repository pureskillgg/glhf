---
name: Send to staging
run-name: Send ${{ github.ref_name }} to staging

on:
  push:
    tags:
      - v*

concurrency:
  group: promote-staging
  cancel-in-progress: false

jobs:
  staging:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Send ${{ github.ref_name }} to staging
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.GH_TOKEN }}
          event-type: release
          client-payload: '{"environment": "staging", "ref": "${{ github.ref_name }}"}'
